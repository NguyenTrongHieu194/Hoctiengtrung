<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Stylized Chinese Hanzi & Dragon/Book motif -->
  <g filter="url(#shadow)">
    <!-- Book pages -->
    <path d="M120 380 C190 350, 240 370, 256 390 C272 370, 322 350, 392 380 L392 190 C322 160, 272 180, 256 200 C240 180, 190 160, 120 190 Z" fill="#ffffff" fill-opacity="0.95" />
    <path d="M256 200 L256 390" stroke="#2563eb" stroke-width="8" stroke-linecap="round" />
    <!-- Center Hanzi '中' or '学' -->
    <circle cx="256" cy="130" r="45" fill="#f59e0b" />
    <text x="256" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">中</text>
    <!-- Character on left page -->
    <text x="185" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#1e3a8a" text-anchor="middle">汉</text>
    <!-- Character on right page -->
    <text x="325" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ea580c" text-anchor="middle">语</text>
  </g>
</svg>
